<!doctype html><meta charset=utf-8><style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:'Arial Rounded MT Bold',ui-rounded,sans-serif}
.i{position:absolute;left:0;right:0;text-align:center;line-height:1.05}
.big{color:#fff;-webkit-text-stroke:var(--s) #292c2a;paint-order:stroke fill}
.big b{color:#ffd166}.big i{color:#7bd6ff;font-style:normal}
.stk{display:inline-block;background:var(--bg);color:#292c2a;border:6px solid #292c2a;border-radius:28px;padding:14px 34px;box-shadow:0 9px 0 #292c2a;transform:rotate(var(--r))}
.pill{display:inline-block;background:#fffdf6;color:#292c2a;border:5px solid #292c2a;border-radius:40px;padding:10px 28px;margin:6px 8px;box-shadow:0 6px 0 #292c2a}
</style><div id=root></div>
<script>const q=new URLSearchParams(location.search);document.body.style.width=q.get('w')+'px';document.body.style.height=q.get('h')+'px';
for(const it of JSON.parse(q.get('items')||'[]')){const d=document.createElement('div');d.className='i';d.style.top=it.y+'px';d.style.fontSize=it.size+'px';if(it.kind==='sticker'){const s=document.createElement('span');s.className='stk';s.style.setProperty('--bg',it.bg||'#ffd166');s.style.setProperty('--r',(it.rot||0)+'deg');s.innerHTML=it.text;d.append(s);}else if(it.kind==='pills'){for(const p of it.text.split('|')){const s=document.createElement('span');s.className='pill';s.textContent=p;d.append(s);}}else{d.classList.add('big');d.style.setProperty('--s',Math.round(it.size*.14)+'px');d.innerHTML=it.text;}document.getElementById('root').append(d);}</script>
