<!doctype html><meta charset=utf-8><style>
html,body{margin:0;overflow:hidden;font-family:'Arial Rounded MT Bold',ui-rounded,sans-serif;color:#292c2a}
body{background:linear-gradient(160deg,#ff8a5c,#ffd166 45%,#7bd6a0);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
img{width:var(--hw);filter:drop-shadow(0 10px 0 #292c2a33)}
h1{margin:0;font-size:var(--t);color:#fff;-webkit-text-stroke:calc(var(--t)*.12) #292c2a;paint-order:stroke fill;line-height:1}
h1 span{color:#e53950}
.tag{font-size:calc(var(--t)*.5);margin:.3em 0 .5em}
.pills span{display:inline-block;background:#fffdf6;border:5px solid #292c2a;border-radius:40px;padding:.25em .7em;margin:.25em;font-size:calc(var(--t)*.32);box-shadow:0 6px 0 #292c2a}
.soon{margin-top:.6em;background:#e53950;color:#fff;border:6px solid #292c2a;border-radius:24px;padding:.2em .9em;font-size:calc(var(--t)*.48);transform:rotate(-3deg);box-shadow:0 8px 0 #292c2a}
</style><img id=hero src="zz-hero.png"><h1 id=t>Gabriel's<br><span>Animation Studio</span></h1><div class=tag>Draw it. Play it. 🎨🎮</div><div class=pills><span>7 big adventures</span><span>160+ levels</span><span>Works offline</span><span>No ads</span></div><div class=soon id=soon>Coming soon!</div>
<script>const q=new URLSearchParams(location.search);document.body.style.width=q.get('w')+'px';document.body.style.height=q.get('h')+'px';document.body.style.setProperty('--t',q.get('t')+'px');document.body.style.setProperty('--hw',q.get('hw')+'px');if(q.get('soon'))soon.textContent=q.get('soon');</script>
