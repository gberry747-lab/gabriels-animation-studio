<body>
<header><div class="brand"><h1>Gabriel's <span>Animation Studio</span></h1><span class="tagline">Your drawing. Your little adventure.</span></div><div class="header-buttons"><button class="sound" id="player" aria-label="Player name">👤 Name</button><button class="sound" id="music" aria-label="Music">🎵 Groove</button><button class="sound" id="sound" aria-label="Mute sound" aria-pressed="false">Sound on</button></div></header>
<div class="game-ui game-top" id="gameTop" hidden><button id="back">← Draw</button><strong id="gameTitle"></strong><div class="game-stats"><span id="hearts" class="hearts" aria-label="3 hearts">♥♥♥</span><span id="score">0 stars</span></div><div class="header-buttons"><button id="gameMusic" class="sound" aria-label="Music">🎵 Groove</button><button id="gameSound" class="sound" aria-label="Mute sound">Sound on</button></div></div>
<main>
<div class="stage" id="stage"><canvas id="canvas" width="1280" height="720" aria-label="Your drawing paper. Draw a stick figure with a finger, Apple Pencil, or mouse."></canvas><div class="result" id="result" hidden><h2 id="resultTitle"></h2><p id="resultText"></p><div class="again-row"><button id="again">Play again</button><button id="resultBack" class="secondary">Back to drawing</button></div></div></div>
<p class="draw-ui hint" id="hint" role="status" aria-live="polite">Draw a stick figure, then tap Walk to make it move.</p>
<div class="draw-ui deck" id="deck">
<div class="tabs" id="tabs" role="tablist" aria-label="What do you want to do?"><button data-tab="draw" aria-pressed="true">✏️<span>Draw</span></button><button data-tab="moves" aria-pressed="false">🕺<span>Moves</span></button><button data-tab="dress" aria-pressed="false">🎭<span>Dress up</span></button><button data-tab="games" aria-pressed="false">🎮<span>Games</span></button></div>
<div class="tools" data-panel="draw">
<div class="toolgroup"><button id="pen" aria-pressed="true">Pen</button><button id="eraser" aria-pressed="false">Eraser</button><button id="undo" disabled>Undo</button><button id="clear" disabled>Clear</button><button id="background">Scene: Paper</button></div>
<div class="palette" id="palette" role="group" aria-label="Pen color"></div>
<div class="widths" id="widths" role="group" aria-label="Pen thickness"></div>
</div>
<div class="moves" id="moves" data-panel="moves" role="group" aria-label="Make your drawing move"></div>
<div class="outfit" id="outfitBox" data-panel="dress"><div class="outfit-head"><strong>Outfit &amp; Morph</strong><div class="row"><button id="morph" aria-pressed="false">✨ Morph into character</button><button id="heroes">🦸 My heroes</button></div></div><div id="outfit"></div></div>
<div class="games-panel" data-panel="games">
<p class="section-title">Mini games</p>
<div class="games" id="games" role="group" aria-label="Play a game with your drawing"><button data-game="platform"><small>🏃</small> Jump &amp; Run</button><button data-game="dash"><small>👟</small> Endless Dash</button><button data-game="catch"><small>⭐</small> Star Catch</button><button data-game="flap"><small>🐦</small> Sky Flap</button><button data-game="pop"><small>🫧</small> Bubble Pop</button><button data-game="dodge"><small>☄️</small> Meteor Dodge</button><button data-game="bounce"><small>☁️</small> Cloud Bounce</button><button data-game="goal"><small>⚽</small> Goal Kick</button></div>
<p class="section-title">Fight &amp; adventure</p>
<div class="games2" id="games2" role="group" aria-label="Fight and adventure games"><button id="vs2">🥊 VS Fight (2 players)</button><button id="vscpu">🤖 VS Computer</button><button id="brawl">👾 Monster Brawl</button><button id="quest">🚀 Space Quest</button><button id="house">🏠 House Hunt</button><button id="plane">✈️ Sky Pilot</button><button id="hoops">🏀 Hoop Shot</button><button id="online">🌐 Online VS (beta)</button></div>
</div>
</div>
<div class="game-ui" id="gameBottom" hidden><p class="game-message" id="gameMessage" role="status"></p><div class="game-controls"><div class="directions" id="directions"><button class="control" id="left" aria-label="Move left">←</button><button class="control" id="right" aria-label="Move right">→</button></div><button class="control action" id="jump">Jump ↑</button></div><div id="pads" hidden></div></div>
<div class="modal" id="modal" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="panel-head"><h2 id="modalTitle"></h2><button id="modalClose" aria-label="Close">✕</button></div><div class="panel-body" id="modalBody"></div></div></div>
</main>
<footer class="draw-ui" id="footer">Made by you. Saved on this device.</footer>
<script>
(() => {

']){const b=$(side);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held[side].add(e.pointerId);b.classList.add('held');unlockAudio();};const release=e=>{held[side].delete(e.pointerId);if(!held[side].size)b.classList.remove('held');};b.onpointerup=b.onpointercancel=b.onlostpointercapture=release;}const j=$('jump');j.onpointerdown=e=>{e.preventDefault();j.setPointerCapture(e.pointerId);j.classList.add('held');jump();};j.onpointerup=j.onpointercancel=j.onlostpointercapture=()=>j.classList.remove('held');document.addEventListener('keydown',e=>{if(!game)return;if(game.mod){modKey(e,true);return;}const side=e.code==='ArrowLeft'||e.code==='KeyA'?'left':e.code==='ArrowRight'||e.code==='KeyD'?'right':null;if(side){e.preventDefault();held[side].add('keyboard');}if(['ArrowUp','Space','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump();}if(e.code==='Escape')backToDrawing();});document.addEventListener('keyup',e=>{if(game&&game.mod){modKey(e,false);return;}if(['ArrowLeft','KeyA'].includes(e.code))held.left.delete('keyboard');if(['ArrowRight','KeyD'].includes(e.code))held.right.delete('keyboard');});document.addEventListener('pointerdown',unlockAudio,{passive:true});window.addEventListener('blur',()=>{finishStroke();clearHeld();});document.addEventListener('visibilitychange',()=>{finishStroke();clearHeld();lastTime=0;storageSave();if(document.hidden)musicPause();else musicStart();});window.addEventListener('pagehide',storageSave);window.addEventListener('resize',resize);if(typeof ResizeObserver==='function')new ResizeObserver(resize).observe($('stage'));canvas.addEventListener('contextmenu',e=>e.preventDefault());}

// ---------- Drawing helpers ----------
function rect(x,y,w,h,fill,stroke,lw){ctx.beginPath();ctx.rect(x,y,w,h);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.stroke();}}
function rrect(x,y,w,h,r,fill,stroke,lw){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.stroke();}}
function poly(pts,fill,stroke,lw){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.lineJoin='round';ctx.stroke();}}
function line(x1,y1,x2,y2,stroke,lw){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.lineCap='round';ctx.stroke();}
function circle(x,y,r,fill,stroke,lw){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.stroke();}}
function sky(c0,c1,y0=0,y1=H){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function cloud(x,y,s,fill='#fff'){ellipse(x,y,44*s,26*s,fill);ellipse(x-34*s,y+6*s,30*s,20*s,fill);ellipse(x+36*s,y+6*s,32*s,21*s,fill);ellipse(x+6*s,y-16*s,30*s,22*s,fill);ellipse(x+2*s,y+14*s,60*s,9*s,'rgba(0,0,0,.06)');ellipse(x-6*s,y-18*s,16*s,8*s,'rgba(255,255,255,.35)');}
function repeatX(period,k,cam,fn){const off=-((((cam*k)%period)+period)%period);for(let x=off-period;x<W+period;x+=period)fn(x);}
function shade(hex,amt){if(!/^#[0-9a-f]{6}$/i.test(hex||''))return amt<0?'#444':'#ccc';const n=parseInt(hex.slice(1),16),f=v=>clamp(Math.round(amt<0?v*(1+amt):v+(255-v)*amt),0,255);return '#'+[f(n>>16),f((n>>8)&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');}

function fightPose(name,t,p,f){const RA=f?f.ra:PI-.62,LA=f?f.la:PI+.62,q=t*TAU,s=Math.sin(q);

else if(name==='Punch'){const k=Math.sin(clamp(t,0,1)*PI);p.ra=(PI/2-.1)-RA;p.rf=-(1-k)*1.7;p.la=(PI/2+.9)-LA;p.lf=-1.9;p.spine=.22*k;p.ll=-.3;p.rl=.4;p.rk=-.35;}
else if(name==='Swing'){const k=Math.sin(clamp(t,0,1)*PI);p.ra=(-.5+k*2.2)-RA;p.rf=-.3;p.la=(PI/2+.8)-LA;p.lf=-1.8;p.spine=-.1+.35*k;p.ll=-.3;p.rl=.4;p.rk=-.3;}
else if(name==='Shoot'){p.ra=(PI/2)-RA;p.rf=0;p.la=(PI/2+.6)-LA;p.lf=-1.6;p.spine=-.05;p.ll=-.25;p.rl=.3;}
else if(name==='Block'){p.ra=(PI/2+.3)-RA;p.rf=-2.3;p.la=(PI/2+.6)-LA;p.lf=-2.4;p.spine=-.05;p.lk=-.3;p.rk=-.3;p.ll=-.2;p.rl=.2;p.dy=6;}
else if(name==='Hurt'){p.spine=-.4;p.ra=.4-RA;p.rf=-.6;p.la=-.4-LA;p.lf=-.6;p.ll=-.3;p.rl=.35;p.lk=-.4;}
else if(name==='KO'){const k=clamp(t,0,1);p.rot=-PI/2*k;p.la=.9*k;p.ra=-.9*k;p.lk=-.5*k;p.rk=-.5*k;}

else{L.segs.push({x:0,w:420});let px=520,py=560;while(px<L.len-700){const wd=rand(180,300);L.plats.push({x:px,y:py,w:wd,cloud:true});px+=wd+rand(110,190);py=clamp(py+rand(-110,110),380,600);}L.segs.push({x:L.len-560,w:900});}
for(let px=700;px<L.len-800;px+=rand(380,620))L.plats.push({x:px,y:rand(380,500),w:rand(150,240)});
for(let i=0;i<5;i++){const cx=900+i*((L.len-1900)/4),p=L.plats.find(p=>Math.abs(p.x+p.w/2-cx)<220);L.cells.push({x:p?p.x+p.w/2:cx,y:p?p.y-60:FLOOR-80,taken:false});}
const inner=L.segs.filter(s=>s.w>360&&s.x>300&&s.x<L.len-900);for(let i=0;i<w.enemies;i++){const seg=inner.length?inner[Math.floor(Math.random()*inner.length)]:L.segs[0];const range=Math.min(120,seg.w/2-90);const ex=clamp(seg.x+seg.w/2+rand(-seg.w/4,seg.w/4),seg.x+range+40,seg.x+seg.w-range-40);L.enemies.push({x:ex,origin:ex,y:FLOOR,v:rand(50,90)*(Math.random()<.5?1:-1),range:Math.max(30,range),alive:true});}

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function openModal(title,build){$('modalTitle').textContent=title;const body=$('modalBody');body.innerHTML='';build(body);$('modal').hidden=false;}
function closeModal(){$('modal').hidden=true;$('modalBody').innerHTML='';}
function openScenePicker(){finishStroke();openModal('Pick a scene',body=>{const grid=el('div','scene-grid');SCENES.forEach((name,i)=>{const b=el('button','scene-card');b.setAttribute('aria-pressed',String(i===background));const c=document.createElement('canvas');c.width=192;c.height=108;try{renderToCanvas(c,()=>{ctx.setTransform(192/W,0,0,108/H,0,0);const sb=background;background=i;scene(0,0);background=sb;});}catch(e){}b.append(c,el('span',null,name));b.onclick=()=>{background=i;$('background').textContent='Scene: '+name;hint(name+' background. Your drawing has a new world!');dirty=true;queueSave();closeModal();};grid.append(b);});body.append(grid);});}
function openHeroes(){finishStroke();openModal('My heroes',body=>{const top=el('div','row');const nameIn=document.createElement('input');nameIn.type='text';nameIn.maxLength=24;nameIn.placeholder='Name your hero';nameIn.value=heroName||randomHeroName();const save=el('button',null,'💾 Save my drawing as a hero');save.onclick=()=>{if(!strokes.length){closeModal();hint('Draw a stick figure first, then save it!');return;}const h=snapshotHero(nameIn.value.trim()||randomHeroName());if(h){closeModal();hint(h.name+' saved! Saved heroes can fight each other in VS Fight.');}};top.append(nameIn,save);body.append(top);body.append(el('p','muted','Saved heroes keep their outfit and morph. Load one to keep drawing on it, or pick two in VS Fight.'));if(!heroes.length)body.append(el('p','muted','No saved heroes yet.'));const list=el('div','hero-grid');for(const h of heroes){const card=el('div','hero-card');const c=document.createElement('canvas');c.width=140;c.height=140;try{drawCharacterThumb(c,buildCharacter(h));}catch(e){}const row=el('div','row');const load=el('button',null,'Load');load.onclick=()=>{loadHero(h);closeModal();};const del=el('button','danger','Delete');del.onclick=()=>{if(del.dataset.sure){heroes=heroes.filter(x=>x!==h);saveHeroes();openHeroes();}else{del.dataset.sure='1';del.textContent='Really delete?';}};row.append(load,del);card.append(c,el('strong',null,h.name),row);list.append(card);}body.append(list);});}
function pickGrid(grid,opts,sel,onPick){grid.innerHTML='';for(const o of opts){const card=el('button','pick-card');card.setAttribute('aria-pressed',String(o.key===sel));const c=document.createElement('canvas');c.width=120;c.height=120;if(!o.thumb){try{drawCharacterThumb(c,o.ch);}catch(e){}o.thumb=c;}else c.getContext('2d').drawImage(o.thumb,0,0);card.append(c,el('span',null,o.name));card.onclick=()=>onPick(o.key);grid.append(card);}}
function fightOptions(){const opts=[];if(strokes.length&&ensureRig()){const c=currentCharacter();if(c)opts.push({key:'current',name:'Your drawing'+(heroName?' - '+heroName:''),ch:c});}for(const h of heroes){try{opts.push({key:h.id,name:h.name,ch:buildCharacter(h)});}catch(e){}}for(const b of BOTS){try{opts.push({key:'bot:'+b.name,name:b.name+' 🤖',ch:makeBot(b)});}catch(e){}}return opts;}
function openVsSetup(cpu){finishStroke();const opts=fightOptions();if(!opts.length){hint('Draw a stick figure first, then tap a fight!');return;}let p1=opts[0].key,p2=(opts.find(o=>o.key!==p1&&o.key.startsWith('bot:'))||opts.find(o=>o.key!==p1)||opts[0]).key,level='normal';
openModal(cpu?'VS Computer':'VS Fight - 2 players',body=>{body.append(el('p','muted',cpu?'Pick your hero and a computer opponent. Outfits matter: swords reach further, capes glide, shields block everything, wands and blasters shoot!':'Each player picks a hero. Player 1 uses the left buttons (or W A S D + F G H). Player 2 uses the right buttons (or arrows + J K L).'));const cols=el('div','vs-cols'),c1=el('div'),c2=el('div');c1.append(el('h3',null,cpu?'You':'Player 1'));c2.append(el('h3',null,cpu?'Computer':'Player 2'));const g1=el('div','pick-grid'),g2=el('div','pick-grid');c1.append(g1);c2.append(g2);cols.append(c1,c2);body.append(cols);const render=()=>{pickGrid(g1,opts,p1,k=>{p1=k;render();});pickGrid(g2,opts,p2,k=>{p2=k;render();});};render();
if(cpu){const row=el('div','row');row.append(el('span','outfit-label','Level'));for(const k of ['easy','normal','hard']){const b=el('button',null,AI_LEVELS[k].name);b.setAttribute('aria-pressed',String(level===k));b.onclick=()=>{level=k;[...row.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};row.append(b);}body.append(row);}
const go=el('button','big','🥊 Fight!');go.onclick=()=>{const o1=opts.find(o=>o.key===p1),o2=opts.find(o=>o.key===p2);closeModal();startModGame(FIGHT,{p1:o1.ch,p2:o2.ch,cpu:cpu?level:null});};const r=el('div','row');r.append(go);body.append(r);});}
function openQuestMap(){finishStroke();if(!strokes.length){hint('Draw a stick figure first, then blast off!');return;}openModal('Space Quest - pick a world',body=>{body.append(el('p','muted','Fly from Earth to the Sun. Each rocket launch unlocks the next world. Collect 5 fuel cells on every world.'));const grid=el('div','world-grid');WORLDS.forEach((w,i)=>{const locked=i+1>progress.quest.unlocked,b=el('button','world-card');b.disabled=locked;const cells=progress.quest.cells[w.name]||0;b.append(el('span','world-emoji',locked?'🔒':w.emoji),el('span',null,w.name),el('small',null,locked?'Locked':'⚡ '+cells+' / 5'));b.onclick=()=>{closeModal();startModGame(QUEST,{world:i});};grid.append(b);});body.append(grid);});}
// ----- Online VS (beta) via PeerJS room codes -----
const NET={peer:null,conn:null,role:null,code:null,remote:null,remoteCtl:null,state:null,status:'',lastSend:0};
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function randomCode(){let s='';for(let i=0;i<4;i++)s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return s;}
function netStatus(s){NET.status=s;const e=$('netStatus');if(e)e.textContent=s;}
function netClose(){try{if(NET.conn)NET.conn.close();}catch(e){}try{if(NET.peer)NET.peer.destroy();}catch(e){}NET.peer=NET.conn=null;NET.role=null;NET.remote=null;NET.remoteCtl=null;NET.state=null;}
function loadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=()=>res();s.onerror=()=>rej(new Error('offline'));document.head.append(s);});}
function serializeChar(ch){return{name:ch.name,strokes:ch.strokes.filter(s=>ch.rig.ids.has(s.id)).map(s=>({id:s.id,color:s.color,width:s.width,points:s.points.map(p=>({x:Math.round(p.x*10)/10,y:Math.round(p.y*10)/10}))})),fit:ch.rig.fit,outfit:ch.outfit,morph:ch.morph};}
function validChar(c){return !!c&&typeof c.name==='string'&&Array.isArray(c.strokes)&&c.strokes.length>0&&c.strokes.length<=3000&&c.strokes.every(validStroke)&&validFit(c.fit);}
async function netHost(){if(!ensureRig())return;netClose();netStatus('Starting...');try{await loadPeer();}catch(e){netStatus('Could not load the online helper. Is the internet on?');return;}NET.role='host';NET.code=randomCode();const peer=NET.peer=new Peer('gas-'+NET.code,{debug:0});peer.on('open',()=>netStatus('Your room code is '+NET.code+'. Tell your friend to tap Join and type it.'));peer.on('connection',c=>{if(NET.conn){c.close();return;}NET.conn=c;netWire(c);});peer.on('error',e=>{if(e&&e.type==='unavailable-id'){netHost();return;}netStatus('Online error: '+((e&&(e.type||e.message))||e));});peer.on('disconnected',()=>netStatus('Lost the online helper. Tap Host again.'));}
async function netJoin(code){if(!ensureRig())return;code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==4){netStatus('Type the 4-letter code first.');return;}netClose();netStatus('Joining '+code+'...');try{await loadPeer();}catch(e){netStatus('Could not load the online helper. Is the internet on?');return;}NET.role='guest';NET.code=code;const peer=NET.peer=new Peer({debug:0});peer.on('open',()=>{const c=peer.connect('gas-'+code,{reliable:true});NET.conn=c;netWire(c);setTimeout(()=>{if(NET.conn===c&&!c.open)netStatus('No game found with code '+code+'. Check the code and try again.');},9000);});peer.on('error',e=>netStatus('Online error: '+((e&&(e.type||e.message))||e)));}
function netWire(c){c.on('open',()=>{netStatus('Connected! Sending heroes...');const me=currentCharacter();if(me)c.send({t:'hello',c:serializeChar(me)});});c.on('data',m=>netData(m));c.on('close',()=>{netStatus('The other player left.');if(game&&game.mod===FIGHT&&game.arena.online&&!game.over)finishMod(game,false,'Disconnected','The other player left the game.');});c.on('error',e=>netStatus('Connection problem: '+((e&&e.message)||e)));}
function netData(m){if(!m||typeof m!=='object')return;
if(m.t==='hello'){if(!validChar(m.c)){netStatus('The other hero could not be read.');return;}try{NET.remote=buildCharacter({...m.c,id:'remote',name:String(m.c.name).slice(0,20)||'Friend'});}catch(e){netStatus('The other hero could not be read.');return;}netStatus('Both heroes ready!');if(NET.role==='host')setTimeout(()=>{if(NET.conn){NET.conn.send({t:'go'});netStartFight();}},300);}
else if(m.t==='go'){if(NET.role==='guest'&&NET.remote)netStartFight();}
else if(m.t==='in'&&NET.role==='host'){const h=m.h||{},p=Array.isArray(m.p)?m.p:[],ctl={left:!!h.l,right:!!h.r,up:!!h.u,down:false,a:!!h.a,b:!!h.b,c:!!h.c,press:(NET.remoteCtl&&NET.remoteCtl.press)||{}};for(const k of p)if(['up','a','b','c'].includes(k))ctl.press[k]=true;NET.remoteCtl=ctl;}
else if(m.t==='st'&&NET.role==='guest')NET.state=m;
else if(m.t==='end'&&NET.role==='guest'){if(game&&!game.over)finishMod(game,!!m.win,String(m.title||'Game over').slice(0,40),String(m.text||'').slice(0,120));}}
function netStartFight(){closeModal();const me=currentCharacter();if(!me||!NET.remote)return;const host=NET.role==='host';startModGame(FIGHT,{p1:host?me:NET.remote,p2:host?NET.remote:me,online:{role:NET.role}});}
function netSendState(A,dt){A.sendT=(A.sendT||0)+dt;if(A.sendT<.05||!NET.conn)return;A.sendT=0;try{NET.conn.send({t:'st',ph:A.phase,pt:A.pt,rd:A.round,tm:A.timer,f:A.fighters.map(f=>({x:Math.round(f.x),y:Math.round(f.y),vx:f.vx,vy:Math.round(f.vy),fc:f.facing,st:f.state,t:f.st,hp:f.hp,w:f.wins,g:f.grounded,an:f.anim})),sh:A.shots.map(s=>({x:Math.round(s.x),y:Math.round(s.y),vx:s.vx,type:s.type})),ev:A.events});}catch(e){}A.events=[];}

function lbTimeAgo(t){const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago';}
function renderBoard(body,key,rows,note){body.innerHTML='';const G=LB_GAMES[key];if(note)body.append(el('p','muted',note));if((!rows||!rows.length)&&LB.url)body.append(el('p','muted','No scores yet. Be the first!'));else{const tb=el('table','lb-table');rows.forEach((r,i)=>{const me=r.id===lbUid();const tr=el('tr',me?'me':'');const rk=el('td','rank',i===0?'🥇':i===1?'🥈':i===2?'🥉':String(i+1));tr.append(rk,el('td',null,r.name+(me?' (you)':'')),el('td','score',fmtScore(key,r.score)));tb.append(tr);});body.append(tb);}const mine=localBest(key);const inTop=rows&&rows.some(r=>r.id===lbUid());if(mine!=null)body.append(el('p','status',(inTop?'Your best: ':'Your best on this device: ')+fmtScore(key,mine)+(rows&&rows.length&&!inTop&&LB.url?' - not in the top 10 yet. Keep going!':'')));else if(!inTop)body.append(el('p','muted','You have not played '+G.name+' yet. Your best score goes up here when you do.'));const row=el('div','row');const nm=el('button',null,player.name?'👤 Change name':'👤 Pick a name');nm.onclick=()=>openNameModal(false,()=>openLeaderboard(key));const rf=el('button',null,'🔄 Refresh');rf.onclick=()=>openLeaderboard(key);row.append(nm,rf);body.append(row);}
function openLeaderboard(key){if(!LB_GAMES[key])return false;finishStroke();const G=LB_GAMES[key];openModal('🏆 '+G.name+' - Top 10',body=>{const cached=lbCache[key];if(!LB.url){renderBoard(body,key,[],'The online leaderboard is not switched on yet, so this shows your scores on this device.'+(cached?'':''));return;}if(!lbOnline()){renderBoard(body,key,cached?cached.rows:[],cached?'You are offline. Showing the top 10 from '+lbTimeAgo(cached.at)+'.':'You are offline and there is no saved leaderboard yet.');return;}body.append(el('p','status','Loading the online top 10...'));lbFlush().then(()=>lbTop(key)).then(rows=>{if($('modalTitle').textContent.indexOf(G.name)<0)return;renderBoard(body,key,rows,player.name?null:'Pick a player name to put your scores on the board.');},()=>{if($('modalTitle').textContent.indexOf(G.name)<0)return;renderBoard(body,key,cached?cached.rows:[],cached?'Could not reach the leaderboard. Showing the top 10 from '+lbTimeAgo(cached.at)+'.':'Could not reach the leaderboard right now.');});});return true;}
function openNameModal(first,after){openModal(first?'Pick your player name':'Your player name',body=>{body.append(el('p','muted',first?'Scores go on the leaderboard under this name. Make one up - no real names, please. 3 to 12 letters or numbers.':'3 to 12 letters or numbers. Make one up - no real names.'));const row=el('div','row');const inp=document.createElement('input');inp.type='text';inp.maxLength=12;inp.placeholder='PixelFox42';inp.value=player.name||randomPlayerName();inp.setAttribute('aria-label','Player name');const dice=el('button',null,'🎲');dice.setAttribute('aria-label','Random name');dice.onclick=()=>{inp.value=randomPlayerName();};const ok=el('button','big',first?"Let's play!":'Save');const msg=el('p','status','');ok.onclick=()=>{const r=setPlayerName(inp.value);if(!r.ok){msg.textContent=r.why;return;}closeModal();sound('star');hint('Hi '+player.name+'! Hold any game button for a second to see the Top 10.');if(after)after();};row.append(inp,dice,ok);body.append(row,msg);if(first){const skip=el('button','secondary','Skip for now');skip.onclick=()=>{closeModal();hint('No name yet - scores stay on this device. Tap 👤 at the top any time to pick one.');};body.append(skip);}});}
function attachHold(b,key){let tm=null,fired=false;const prev=b.onclick;b.onclick=e=>{if(fired){fired=false;if(e&&e.preventDefault)e.preventDefault();return;}if(prev)prev.call(b,e);};const stop=()=>{clearTimeout(tm);tm=null;b.classList.remove('hold');};b.onpointerdown=e=>{if(e.button!==undefined&&e.button!==0)return;stop();fired=false;b.classList.add('hold');tm=setTimeout(()=>{tm=null;b.classList.remove('hold');fired=true;sound('click');openLeaderboard(key);},700);};b.onpointerup=b.onpointercancel=b.onpointerleave=stop;b.oncontextmenu=e=>{if(e&&e.preventDefault)e.preventDefault();};}
function setTab(name){const tabs=$('tabs');if(!tabs||!tabs.querySelectorAll)return;const names=['draw','moves','dress','games'];if(!names.includes(name))name='draw';tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===name)));document.querySelectorAll('#deck [data-panel]').forEach(p=>{p.hidden=p.dataset.panel!==name;});try{localStorage.setItem('gas-tab-v1',name);}catch(e){}}
function initTabs(){const tabs=$('tabs');if(!tabs||!tabs.querySelectorAll)return;tabs.querySelectorAll('button').forEach(b=>{b.onclick=()=>{setTab(b.dataset.tab);sound('click');};});let t='draw';try{t=localStorage.getItem('gas-tab-v1')||'draw';}catch(e){}setTab(t);}
function initLeaderboards(){loadPlayer();syncPlayerUI();const pb=$('player');if(pb)pb.onclick=()=>openNameModal(false);document.querySelectorAll('.games button[data-game]').forEach(b=>attachHold(b,b.dataset.game));for(const id in LB_BUTTONS){const b=$(id);if(b)attachHold(b,LB_BUTTONS[id]);}const g2=$('games2');if(g2&&g2.insertAdjacentElement)g2.insertAdjacentElement('afterend',el('p','lb-tip','Hold any game button for a second to see its Top 10 leaderboard.'));if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('online',()=>{lbFlush();});if(!player.name)setTimeout(()=>{if(!player.name&&!game&&$('modal').hidden)openNameModal(true);},900);}
function lbKeyFor(g){if(!g)return null;if(g.mod){if(g.type==='fight')return g.arena&&g.arena.cpu?'fightWins':null;return LB_GAMES[g.type]?g.type:null;}return LB_GAMES[g.type]?g.type:null;}
function lbMetric(g){const k=lbKeyFor(g);if(!k)return null;if(k==='brawl')return g.arena.score;if(k==='fightWins')return g.won?progress.bests.fightWins||0:null;if(k==='house')return g.won?Math.round(g.h.timer):null;if(k==='plane')return g.f.pts;if(k==='hoops')return g.b.score;if(k==='quest')return localBest('quest');return null;}
function initPart2(){initMusic();loadHeroes();loadProgress();const bar=$('outfit');$('morph').onclick=()=>{finishStroke();if(!rig&&!ensureRig())return;setMorph(!morph);hint(morph?'Morphed! Your drawing is a real character now. Tap again to go back to lines.':'Back to your drawing lines.');};
for(const slot in OUTFIT_SLOTS){const row=el('div','outfit-row');row.append(el('span','outfit-label',{hat:'Hat',cape:'Cape',top:'Top',weapon:'Weapon',skin:'Skin'}[slot]));for(const [key,name] of OUTFIT_SLOTS[slot]){const b=el('button',null,name);b.dataset.slot=slot;b.dataset.key=key;b.setAttribute('aria-pressed',String(outfit[slot]===key));b.onclick=()=>{finishStroke();if(!rig&&!ensureRig())return;outfit[slot]=key;if(slot==='skin'&&key&&!morph)setMorph(true);syncOutfitUI();dirty=true;queueSave();sound('click');hint(key?name.replace(/^\S+\s/,'')+(slot==='skin'?' skin on! Skins show on the morphed body.':' on! Tap a move or a game to see it in action.'):'Taken off.');};row.append(b);}if(slot==='hat'){const fb=el('button',null,'');fb.id='brim';fb.setAttribute('aria-label','Turn the hat brim the other way');fb.onclick=()=>{finishStroke();if(!rig&&!ensureRig())return;outfit.flip=!outfit.flip;syncOutfitUI();dirty=true;queueSave();sound('click');hint('Hat turned! The brim points '+(outfit.flip?'left':'right')+' now.');};row.append(fb);}bar.append(row);}
syncOutfitUI();$('background').onclick=openScenePicker;$('heroes').onclick=openHeroes;const closeAll=()=>{closeModal();if(NET.peer&&!game)netClose();};$('modalClose').onclick=closeAll;$('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal'))closeAll();});
$('vs2').onclick=()=>openVsSetup(false);$('vscpu').onclick=()=>openVsSetup(true);$('brawl').onclick=()=>startModGame(BRAWL,{});$('quest').onclick=openQuestMap;$('plane').onclick=()=>startModGame(PLANE,{});$('hoops').onclick=()=>startModGame(HOOPS,{});$('house').onclick=()=>startModGame(HOUSE,{});$('online').onclick=openOnline;}

for(const ev of ['gesturestart','gesturechange','gestureend'])document.addEventListener(ev,e=>e.preventDefault());document.addEventListener('dblclick',e=>{if(e.target&&e.target.tagName!=='INPUT')e.preventDefault();},{passive:false});
load();initControls();initPart2();initLeaderboards();initTabs();controls();if(strokes.length)hint('Your drawing is back! Tap a move, or keep drawing.');resize();requestAnimationFrame(frame);registerTools();
/* TEST_HOOK */
})();
